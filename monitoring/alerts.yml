groups:
  - name: qualite-tests
    rules:
      # « Aucun relevé au-dessus de 95 % sur la fenêtre », et non la valeur instantanée : avec une dizaine
      # de tests, un seul échec fait déjà passer un run sous 95 %. Un échec isolé (test instable) est
      # suivi d'un run vert qui remonte le maximum : pas d'alerte. Plusieurs runs rouges de suite la
      # déclenchent. Fenêtre de 16 s : réglée pour le replay de l'atelier (un run toutes les 6 s, un
      # relevé toutes les 5 s) ; en production, prendre la durée qui couvre deux à trois runs.
      # keep_firing_for : l'alerte reste ouverte 30 s après le retour au vert (pas de clignotement).
      - alert: TauxDeReussiteEnBaisse
        expr: max_over_time(ci_tests_pass_ratio{branch="main"}[16s]) < 0.95
        keep_firing_for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Régression : {{ $value | humanizePercentage }} de tests OK sur main"
          description: "Le taux de réussite des tests sur main reste sous 95 % sur plusieurs runs."

      - alert: SuiteDeTestsTropLente
        expr: ci_tests_duration_seconds > 1.5 * avg_over_time(ci_tests_duration_seconds[1h])
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "La suite de tests ralentit ({{ $value | humanizeDuration }})"

      - alert: PasDeRunDepuisLongtemps
        expr: time() - ci_last_run_timestamp > 86400
        labels: { severity: warning }
        annotations:
          summary: "Aucun run de tests depuis 24 h sur {{ $labels.branch }}"

  - name: application
    rules:
      - alert: LatenceP95Elevee
        expr: histogram_quantile(0.95, sum by (le) (rate(minishop_http_request_duration_seconds_bucket[1m]))) > 0.3
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "p95 de MiniShop au-dessus de 300 ms"
