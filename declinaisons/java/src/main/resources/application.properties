# Application MiniShop (déclinaison Java)
spring.application.name=minishop
server.port=8000
minishop.version=1.0.0

# Fichiers statiques servis sous /static/ (comme l'application Python)
spring.mvc.static-path-pattern=/static/**

# Contrat OpenAPI et page de documentation aux mêmes adresses que FastAPI
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.default-produces-media-type=application/json

spring.main.banner-mode=off
